<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Day Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>    
    <div>
    <h1>10-Day Forecast</h1>
        <div class="forecast-row top-row">
            <span class="date"> Thursday 10 Oct</span>
            <div class="icon sunny"></div>
            <span class="temp">39°C / 26°C</span>
            
        </div>

        <div class="forecast-row">
            <span class="date">Friday 11 Oct</span>
            <div class="icon sunny"></div>
            <span class="temp">39°C / 26°C</span>
        </div>

        <div class="forecast-row">
            <span class="date">Saturday 12 Oct</span>
            <div class="icon sunny"></div>
            <span class="temp">38°C / 26°C</span>
        </div>

        <div class="forecast-row">
            <span class="date">Sunday 13 Oct</span>
            <div class="icon cloudy"></div>
            <span class="temp">37°C / 27°C</span>
        </div>

        <div class="forecast-row">
            <span class="date">Monday 14 Oct</span>
            <div class="icon cloudy"></div>
            <span class="temp">36°C / 27°C</span>
        </div>

        <div class="forecast-row">
            <span class="date">Tuesday 15 Oct</span>
            <div class="icon sunny"></div>
            <span class="temp">37°C / 27°C</span>
        </div>
        <div class="forecast-row bottom-row">
            <span class="date">Saturday 16 Oct</span>
            <div class="icon cloudy"></div>
            <span class="temp">37°C / 27°C</span>
        </div>
        <div class="forecast-row bottom-row">
            <span class="date">Saturday 17 Oct</span>
            <div class="icon cloudy"></div>
            <span class="temp">37°C / 27°C</span>
        </div>
        <div class="forecast-row bottom-row">
            <span class="date">Saturday 18 Oct</span>
            <div class="icon sunny"></div>
            <span class="temp">37°C / 27°C</span>
        </div>

        <div class="forecast-row bottom-row">
            <span class="date">Saturday 19 Oct</span>
            <div class="icon cloudy"></div>
            <span class="temp">37°C / 27°C</span>
        </div>
</div>
  
</body>
</html>
