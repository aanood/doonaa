<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Day Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="forecast-container">
        <h1>10-Day Forecast</h1>
        <div class="forecast-row top-row">
            <div class="icon sunny"></div>
            <span class="date">Today</span>
            <span class="temp">39°C / 26°C</span>
        </div>

        <div class="forecast-row">
            <div class="icon sunny"></div>
            <span class="date">Friday 11 aug</span>
            <span class="temp">39°C / 26°C</span>
        </div>

        <div class="forecast-row">
            <div class="icon sunny"></div>
            <span class="date">Saturday 12 aug</span>
            <span class="temp">38°C / 26°C</span>
        </div>

        <div class="forecast-row">
            <div class="icon cloudy"></div>
            <span class="date">Sunday 13 aug</span>
            <span class="temp">37°C / 27°C</span>
        </div>

        <div class="forecast-row">
            <div class="icon cloudy"></div>
            <span class="date">Monday 14 aug</span>
            <span class="temp">36°C / 27°C</span>
        </div>

        <div class="forecast-row">
            <div class="icon sunny"></div>
            <span class="date">Tuesday 15 aug</span>
            <span class="temp">37°C / 27°C</span>
        </div>
        <div class="forecast-row bottom-row">
            <div class="icon cloudy"></div>
            <span class="date">Saturday 16 aug</span>
            <span class="temp">37°C / 27°C</span>
        </div>
        <div class="forecast-row bottom-row">
            <div class="icon cloudy"></div>
            <span class="date">Saturday 17 aug</span>
            <span class="temp">37°C / 27°C</span>
        </div>
        <div class="forecast-row bottom-row">
            <div class="icon cloudy"></div>
            <span class="date">Saturday 18 aug</span>
            <span class="temp">37°C / 27°C</span>
        </div>

        <div class="forecast-row bottom-row">
            <div class="icon cloudy"></div>
            <span class="date">Saturday 19 aug</span>
            <span class="temp">37°C / 27°C</span>
        </div>

    </div>
</body>
</html>
